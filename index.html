      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div>' +
    '<div class="modal-actions"><button class="btn btn-primary" data-act="close">Close</button></div>',
    { wide: true }
  ).querySelector('[data-act="close"]').addEventListener('click', () => closeModal());
}

/* ---- PDF export ---- */
function sphereChartImageFor(entries) {
  const canvas = document.createElement('canvas');
  canvas.width = 480; canvas.height = 300;
  canvas.style.cssText = 'position:fixed;left:-9999px;top:0;';
  document.body.appendChild(canvas);
  const by = sphereMinutes(entries);
  const active = SPHERE_ORDER.filter(k => by[k] > 0);
  const chart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: active.map(k => SPHERES[k].label + ' — ' + fmtDur(by[k])),
      datasets: [{
        data: active.map(k => by[k]),
        backgroundColor: active.map(k => SPHERES[k].color),
        borderColor: '#FFFFFF',
        borderWidth: 2
      }]
    },
    options: {
      responsive: false, animation: false, devicePixelRatio: 2, cutout: '58%',
      plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } }
    }
  });
  const img = chart.toBase64Image('image/png', 1);
  chart.destroy();
  canvas.remove();
  return img;
}

function exportMagnetPDF() {
  const d = magnetFormData();
  if (!d.selection.length) { toast('Select at least one entry first.', 'warn'); return; }
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('PDF library failed to load. Check your connection.', 'warn'); return; }

  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 54;
  const usable = pageW - margin * 2;
  let y = margin;

  function ensureRoom(needed) {
    if (y + needed > pageH - 60) { doc.addPage(); y = margin; }
  }
  function centered(text, size, style) {
    doc.setFont('helvetica', style || 'normal');
    doc.setFontSize(size);
    const lines = doc.splitTextToSize(text, usable);
    lines.forEach(line => {
      ensureRoom(size * 1.3);
      doc.text(line, pageW / 2, y, { align: 'center' });
      y += size * 1.3;
    });
  }
  function section(label, text) {
    ensureRoom(40);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text(label, margin, y);
    y += 16;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(text || '—', usable);
    lines.forEach(line => {
      ensureRoom(14);
      doc.text(line, margin, y);
      y += 14;
    });
    y += 8;
  }

  // ---- Page 1: header + narrative
  centered(d.title, 18, 'bold');
  y += 4;
  const who = [settings.name, settings.credentials].filter(Boolean).join(', ');
  if (who) centered(who, 11);
  const where = [settings.unit, settings.department, settings.hospital].filter(Boolean).join(' / ');
  if (where) centered(where, 10);
  if (d.dateRange) centered('Evidence period: ' + d.dateRange, 10);
  centered('Magnet Model Component: ' + d.component, 10);
  if (d.pillars.length) centered('HFH Pillar(s): ' + d.pillars.join(', '), 10);
  if (d.spheres.length) centered('CNS Sphere(s) of Impact: ' + d.spheres.join(', '), 10);
  y += 6;
  doc.setDrawColor(180);
  doc.line(margin, y, pageW - margin, y);
  y += 20;

  section('Setting / Context', d.setting);
  section('Problem or Gap Identified', d.problem);
  section('CNS Actions and Interventions', d.actions);
  section('Participants', d.participants);
  section('Outcomes', d.outcomes);
  if (d.disseminated) section('Dissemination', d.dissemination || 'Published or presented externally.');

  // ---- Page 2: chart + evidence log
  doc.addPage();
  y = margin;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('Time Distribution — Selected Evidence', margin, y);
  y += 14;
  try {
    const img = sphereChartImageFor(d.selection.map(x => x.entry));
    const imgW = 380, imgH = imgW * (300 / 480);
    doc.addImage(img, 'PNG', (pageW - imgW) / 2, y, imgW, imgH);
    y += imgH + 24;
  } catch (e) {
    y += 10;
  }
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('Evidence Log', margin, y);
  y += 10;

  const tableBody = d.selection.map(x => {
    const e = x.entry;
    return [
      fmtDateShort(x.shiftDate),
      e.taskName,
      SPHERES[e.sphere].label,
      e.project || '—',
      fmtDur(entryDurationMins(e)),
      e.pillars.join(', ') || '—',
      [e.notes, e.magnetNote].filter(Boolean).join(' | ')
    ];
  });
  doc.autoTable({
    startY: y + 6,
    margin: { left: margin, right: margin, bottom: 64 },
    head: [['Date', 'Task', 'Sphere', 'Project', 'Duration', 'HFH Pillars', 'Notes/Magnet Note']],
    body: tableBody,
    styles: { font: 'helvetica', fontSize: 8, cellPadding: 4, overflow: 'linebreak' },
    headStyles: { fillColor: [30, 41, 59], textColor: 255, fontSize: 8 },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    columnStyles: { 0: { cellWidth: 58 }, 4: { cellWidth: 48 } }
  });

  // ---- Footer on every page
  const generated = new Date().toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(120);
    doc.text('CNS PracticeLog  |  winowie9@msu.edu  |  Generated ' + generated, pageW / 2, pageH - 30, { align: 'center' });
    doc.setTextColor(0);
  }

  doc.save('CNS_PracticeLog_' + localDateStr(new Date()) + '.pdf');
  toast('PDF exported.');
}

/* =====================================================================
   Settings
===================================================================== */
function renderSettings() {
  const el = document.getElementById('screen-settings');
  const hidden = new Set(settings.hiddenTaskNames || []);
  const customNames = new Set((settings.customTasks || []).map(t => t.name));

  const taskListHtml = SPHERE_ORDER.map(k => {
    const inSphere = allTasks().filter(t => t.sphere === k);
    if (!inSphere.length) return '';
    return '<div class="sphere-group-label">' + escapeHtml(SPHERES[k].label) + '</div>' +
      inSphere.map(t => {
        const isHidden = hidden.has(t.name);
        const isCustom = customNames.has(t.name);
        return '<div class="task-row' + (isHidden ? ' hidden-task' : '') + '">' +
          '<span class="task-name">' + escapeHtml(t.name) + (isCustom ? ' <span class="muted small">(custom)</span>' : '') + '</span>' +
          sphereBadge(t.sphere) +
          '<button class="btn btn-sm" data-toggle-task="' + escapeHtml(t.name) + '">' + (isHidden ? 'Show' : 'Hide') + '</button>' +
          (isCustom ? '<button class="btn btn-sm btn-danger" data-del-task="' + escapeHtml(t.name) + '">Delete</button>' : '') +
          (t.suggestedPillars.length ? '<div class="task-pillars">Suggested pillars: ' + escapeHtml(t.suggestedPillars.join(', ')) + '</div>' : '') +
        '</div>';
      }).join('');
  }).join('');

  el.innerHTML =
    '<h2 class="screen-title">Settings</h2>' +
    '<div class="card">' +
      '<h3>User Profile</h3>' +
      '<div class="form-row">' +
        '<div><label class="field-label" for="set-name">Name</label><input type="text" id="set-name" value="' + escapeHtml(settings.name) + '"></div>' +
        '<div><label class="field-label" for="set-credentials">Credentials</label><input type="text" id="set-credentials" value="' + escapeHtml(settings.credentials) + '" placeholder="e.g., MSN, APRN, AGCNS-BC"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div><label class="field-label" for="set-unit">Unit</label><input type="text" id="set-unit" value="' + escapeHtml(settings.unit) + '"></div>' +
        '<div><label class="field-label" for="set-department">Department</label><input type="text" id="set-department" value="' + escapeHtml(settings.department) + '"></div>' +
        '<div><label class="field-label" for="set-hospital">Hospital</label><input type="text" id="set-hospital" value="' + escapeHtml(settings.hospital) + '"></div>' +
      '</div>' +
      '<div style="margin-top:16px"><button class="btn btn-primary" id="set-save">Save Profile</button></div>' +
    '</div>' +
    '<div class="card">' +
      '<h3>Task Management</h3>' +
      '<p class="muted small" style="margin-top:0">Hidden tasks do not appear in the task picker anywhere in the app. Existing logged entries are unaffected.</p>' +
      taskListHtml +
      '<h3 style="margin-top:24px">Add Custom Task</h3>' +
      '<label class="field-label" for="ct-name">Task name</label>' +
      '<input type="text" id="ct-name">' +
      '<label class="field-label" for="ct-sphere">Sphere</label>' +
      '<select id="ct-sphere">' + SPHERE_ORDER.map(k => '<option value="' + k + '">' + escapeHtml(SPHERES[k].label) + '</option>').join('') + '</select>' +
      '<label class="field-label">Suggested pillars <span class="opt">(optional)</span></label>' +
      pillarChecks('ct-pillars', [], 'ct-pil') +
      '<div style="margin-top:14px"><button class="btn btn-primary" id="ct-add">Add Custom Task</button></div>' +
      '<div style="margin-top:20px;border-top:1px solid var(--color-border);padding-top:16px">' +
        '<button class="btn btn-danger" id="tasks-reset">Reset task list to defaults</button>' +
      '</div>' +
    '</div>';

  document.getElementById('set-save').addEventListener('click', () => {
    settings.name = document.getElementById('set-name').value.trim();
    settings.credentials = document.getElementById('set-credentials').value.trim();
    settings.unit = document.getElementById('set-unit').value.trim();
    settings.department = document.getElementById('set-department').value.trim();
    settings.hospital = document.getElementById('set-hospital').value.trim();
    saveSettings();
    toast('Profile saved.');
  });

  el.querySelectorAll('[data-toggle-task]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.toggleTask;
      const list = settings.hiddenTaskNames || [];
      if (list.includes(name)) settings.hiddenTaskNames = list.filter(n => n !== name);
      else settings.hiddenTaskNames = list.concat([name]);
      saveSettings();
      renderSettings();
    });
  });
  el.querySelectorAll('[data-del-task]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.delTask;
      confirmDialog({
        title: 'Delete custom task?',
        message: 'Delete the custom task "' + name + '"? Existing logged entries using it are unaffected.',
        confirmLabel: 'Delete', danger: true,
        onConfirm: () => {
          settings.customTasks = (settings.customTasks || []).filter(t => t.name !== name);
          settings.hiddenTaskNames = (settings.hiddenTaskNames || []).filter(n => n !== name);
          saveSettings();
          toast('Custom task deleted.');
          renderSettings();
        }
      });
    });
  });
  document.getElementById('ct-add').addEventListener('click', () => {
    const name = document.getElementById('ct-name').value.trim();
    if (!name) { toast('Enter a task name.', 'warn'); return; }
    if (allTasks().some(t => t.name === name)) { toast('A task with that name already exists.', 'warn'); return; }
    settings.customTasks = (settings.customTasks || []).concat([{
      name: name,
      sphere: document.getElementById('ct-sphere').value,
      suggestedPillars: Array.from(document.querySelectorAll('input[name="ct-pillars"]:checked')).map(cb => cb.value)
    }]);
    saveSettings();
    toast('Custom task added.');
    renderSettings();
  });
  document.getElementById('tasks-reset').addEventListener('click', () => {
    confirmDialog({
      title: 'Reset task list?',
      message: 'This removes all custom tasks and unhides all default tasks. Logged entries are unaffected.',
      confirmLabel: 'Reset', danger: true,
      onConfirm: () => {
        settings.customTasks = [];
        settings.hiddenTaskNames = [];
        saveSettings();
        toast('Task list reset to defaults.');
        renderSettings();
      }
    });
  });
}

  settings = loadSettings();
  shifts = loadShifts();
  if (getOpenShift()) openShiftFromPriorSession = true;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => showScreen(btn.dataset.screen));
  });

  showScreen('dashboard');

  if (!localStorage.getItem(LS_SETTINGS)) showSetupModal();

  setInterval(tick, 30000);
}

document.addEventListener('DOMContentLoaded', init);
